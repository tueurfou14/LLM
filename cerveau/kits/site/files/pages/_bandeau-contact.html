{#- Bandeau d'appel à l'action, inclus en bas de plusieurs pages : {% include "_bandeau-contact.html" %} -#}
    <section class="bandeau">
      <div class="conteneur bandeau__contenu" data-anim>
        <div>
          <h2>{{ site.bandeau_contact.titre }}</h2>
          <p>{{ site.bandeau_contact.texte }}</p>
        </div>
        <div class="boutons">
          <a class="bouton bouton--clair" href="contact.html">{{ site.bandeau_contact.bouton }}</a>
          <a class="bouton bouton--contour-clair" href="tel:{{ site.coordonnees.telephone | tel }}">{{ site.coordonnees.telephone }}</a>
        </div>
      </div>
    </section>
