{% extends "base.html" %}
{% block titre %}Connexion · {{ titre_app }}{% endblock %}
{% block public %}
<main class="connexion">
  <form method="post" class="carte">
    <h1>{{ titre_app }}</h1>
    {% if erreur %}<div class="flash erreur">{{ erreur }}</div>{% endif %}
    <input type="hidden" name="suite" value="{{ suite }}">
    <label>Identifiant <input name="identifiant" autocomplete="username" required autofocus></label>
    <label>Mot de passe <input name="mot_de_passe" type="password" autocomplete="current-password" required></label>
    <button type="submit">Se connecter</button>
  </form>
</main>
{% endblock %}
